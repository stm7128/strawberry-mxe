name: Docker
on:
  push:
    branches:
    - main
    - master
    - docker

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ i686 ]
        build_type: [ release, debug ]
    permissions:
      contents: read
      packages: write
    steps:

      - name: Set MXE build type
        run: echo "mxe_build_type=$(echo ${{matrix.build_type}} | tr '[:upper:]' '[:lower:]' | sed 's/.*/\u&/')" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7

      - name: Add safe git directory
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile
          build-args: |
            MXE_TARGET=${{matrix.arch}}-w64-mingw32.shared
            MXE_BUILD_TYPE=${{env.mxe_build_type}}
          tags: ghcr.io/${{ github.repository_owner }}/strawberry-mxe-${{matrix.arch}}-${{matrix.build_type}}:latest
          push: true
